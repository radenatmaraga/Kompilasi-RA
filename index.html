  .slide::-webkit-scrollbar { width: 7px; }
  .slide::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .badge { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 5px 12px; border-radius: 999px; margin-bottom: 10px; }

  .badge-amber { background: #fef3e2; color: #8a6a1e; }
  .badge-mint { background: #e8f5e9; color: #2e7d32; }
  .badge-rose { background: #fdecea; color: #b04a30; }
  .badge-cream { background: #faf3e8; color: #8a6d3b; }
  h1 { font-size: 26px; line-height: 1.25; font-weight: 800; margin-bottom: 10px; color: var(--teal); }
  h2 { font-size: 19px; line-height: 1.3; font-weight: 700; margin-bottom: 10px; color: var(--text); }

  .nav { flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; padding: 10px 22px; border-top: 1px solid var(--border); background: #fff; gap: 10px; }
  .nav-group { display: flex; gap: 6px; align-items: center; }
  button { font-family: inherit; font-size: 12px; font-weight: 600; color: var(--teal); background: #fff; border: 1px solid var(--border); padding: 8px 14px; border-radius: 10px; cursor: pointer; transition: all .18s; }
  button:hover:not(:disabled) { background: var(--soft); border-color: var(--teal2); }
  button:disabled { opacity: .35; cursor: not-allowed; }
  button.primary { background: var(--teal); color: #fff; border-color: var(--teal); }
  button.primary:hover:not(:disabled) { background: #0a5f6e; }
  .counter { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .counter strong { color: var(--teal); }
  .dots { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; flex: 1; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); border: none; cursor: pointer; padding: 0; transition: all .18s; }
  .dot.active { background: var(--teal2); transform: scale(1.3); }

  aside.notes { position: fixed; bottom: 0; left: 0; right: 0; max-height: 42vh; background: #fff; border-top: 2px solid var(--teal2); padding: 16px 24px; overflow-y: auto; transform: translateY(100%); transition: transform .28s ease; z-index: 50; box-shadow: 0 -8px 32px var(--shadow); }

  aside.notes .notes-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: var(--teal); }

  @media (max-width: 800px) {
    .slide { padding: 18px 14px; }
    h1 { font-size: 19px; } h2 { font-size: 15px; }
    .cols, .cols-3, .grid2 { grid-template-columns: 1fr; }
    .dots { display: none; }
    table { font-size: 9.5px; }
  }
</style>
</head>

    <span class="badge badge-teal">Fondasi · Mekanisme</span>
    <h2>Mekanisme Kerja Spinal Anestesi</h2>
    <p class="sub">Anestesi lokal disuntikkan ke <b>ruang subaraknoid</b>—ruang berisi CSF yang membungkus medula spinalis.</p>

    <h3>1. Jalur Anatomis</h3>
    <ul class="pts">
      <li><b>Jarum menembus:</b> kulit → subkutan → lig. supraspinosum → interspinosum → flavum → ruang epidural → dura → araknoid → <b>ruang subaraknoid</b>.</li>
      <li><b>Kedalaman:</b> ± 4–6 cm pada midline lumbal dewasa (lebih dalam pada obesitas).</li>
      <li><b>Konfirmasi:</b> CSF keluar spontan → posisi tepat.</li>
    </ul>

    <h3>2. Mekanisme Molekuler</h3>
    <ul class="pts">
      <li>Anestesi lokal (bupivacaine) <b>memblokir kanal Na⁺</b> → tidak ada depolarisasi → tidak ada potensial aksi.</li>
      <li>Serabut kecil (nyeri, suhu) <b>terblok lebih dulu</b>; motorik terakhir → urutan: nyeri → suhu → propriosepsi → motorik.</li>
      <li><b>Opioid intratekal</b> bekerja pada reseptor di kornu dorsalis → analgesia tanpa blokade motorik.</li>
    </ul>

          <li>Diafragma (C3–C5) tetap bekerja.</li>
        </ul>
      </div>
    </div>

/* 13 — PDPH MEKANISME (BARU) */
{
  label: 'PDPH — Mekanisme Detail',
  html: `
    <span class="badge badge-rose">Fokus · PDPH</span>
    <h2>PDPH — Mengapa Sakit Kepala?</h2>
    <p class="sub"><b>PDPH</b> = Post-Dural Puncture Headache = sakit kepala setelah dura tertusuk jarum spinal. Insidens: <b>5,9–12,7%</b>.</p>

    <h3>Mekanisme 6 Langkah: dari Kebocoran ke Nyeri</h3>
    <div class="steps">
      <div class="step">
        <div class="step-num">1</div>
        <div class="step-body"><b>Jarum membuat lubang.</b> Jarum menembus dura mater + araknoid mater. Setelah dicabut, lubang kecil tetap ada.</div>
      </div>
      <div class="step">
        <div class="step-num">2</div>
        <div class="step-body"><b>CSF bocor keluar.</b> Cairan serebrospinal merembes melalui lubang ke ruang epidural—seperti ban dalam bocor sedikit.</div>
      </div>
      <div class="step">
        <div class="step-num">3</div>
        <div class="step-body"><b>Tekanan CSF menurun.</b> Volume &amp; tekanan CSF di ruang subaraknoid turun. Otak kehilangan bantalan air.</div>
      </div>
      <div class="step">
        <div class="step-num">4</div>
        <div class="step-body"><b>Otak "mengendur" ke bawah (brain sagging).</b> Otak turun sedikit karena gravitasi—seperti balon di wadah air yang airnya berkurang.</div>
      </div>
      <div class="step">
        <div class="step-num">5</div>
        <div class="step-body"><b>Traksi meningeal.</b> Struktur peka nyeri (meninges, vena/arteri meningeal, saraf kranial, dura basis otak) <b>tertarik</b> melebihi batas normal → nyeri. <b>"Traksi" = tarikan.</b></div>
      </div>
      <div class="step">
        <div class="step-num">6</div>
        <div class="step-body"><b>Nyeri posisional (ortostatik).</b> Duduk/berdiri → otak turun lebih jauh → traksi lebih kuat → nyeri hebat. Berbaring → gravitasi berkurang → traksi berkurang → nyeri membaik.</div>
      </div>
    </div>

    <div class="analogy"><b>Analogi:</b> Otak = buah apel yang digantung tali di toples berisi air. Tali = meninges. Kalau air (CSF) berkurang, apel turun → tali tertarik kencang → nyeri. Toples dibaringkan → apel tidak tertarik → nyeri hilang.</div>

    <div class="key"><b>Diagnosis ICHD-3:</b> nyeri memburuk dalam 15 menit berdiri/duduk, membaik dalam 15 menit berbaring, muncul dalam 5 hari pasca pungsi. Disertai ≥1: kaku leher, tinitus, fotofobia, mual.</div>
    <div class="cite">📚 Sumber: <a href="https://ichd-3.org/7-headache-attributed-to-non-vascular-intracranial-disorder/7-2-headache-attributed-to-low-csf-pressure/7-2-2-post-dural-puncture-headache/" target="_blank">ICHD-3 — Post-Dural Puncture Headache</a>; <a href="https://doi.org/10.1016/j.bjae.2019.12.002" target="_blank">BJA Education (2020)</a>; <a href="https://nysora.com/topics/complications/post-dural-puncture-headache/" target="_blank">NYSORA — PDPH</a>.</div>
  `,
  notes: "6 langkah: jarum buat lubang → CSF bocor → tekanan turun → brain sagging → traksi meningeal (tarikan selaput) → nyeri posisional. Analogi apel di toples. Diagnosis ICHD-3."

      <li><b>ICHD-3.</b> Post-Dural Puncture Headache. <a href="https://ichd-3.org/7-headache-attributed-to-non-vascular-intracranial-disorder/7-2-headache-attributed-to-low-csf-pressure/7-2-2-post-dural-puncture-headache/" target="_blank">https://ichd-3.org/.../7-2-2-post-dural-puncture-headache/</a></li>
      <li><b>ASRA.</b> LAST Checklist. <a href="https://www.asra.com/" target="_blank">https://www.asra.com/</a></li>

  `,
  notes: "24 sumber dengan link yang bisa diklik."
}

];

/* LOGIC */
let cur = 0;
const slideEl = document.getElementById('slide');
const prevBtn = document.getElementById('prevBtn');
const nextBtn = document.getElementById('nextBtn');
const curNum = document.getElementById('curNum');
const totNum = document.getElementById('totNum');
const progressBar = document.getElementById('progressBar');
const dotsEl = document.getElementById('dots');
const topLabel = document.getElementById('topLabel');
const notesPanel = document.getElementById('notesPanel');
const notesBody = document.getElementById('notesBody');
const notesSlideNum = document.getElementById('notesSlideNum');
const notesBtn = document.getElementById('notesBtn');
const closeNotes = document.getElementById('closeNotes');

totNum.textContent = slides.length;

slides.forEach((_, i) => {
  const d = document.createElement('button');
  d.className = 'dot';
  d.title = 'Slide ' + (i + 1);
  d.addEventListener('click', () => goTo(i));
  dotsEl.appendChild(d);
});

function render() {
  const s = slides[cur];
  slideEl.innerHTML = s.html;
  slideEl.style.animation = 'none';
  void slideEl.offsetWidth;
  slideEl.style.animation = 'fadeIn .3s ease';

  curNum.textContent = cur + 1;
  topLabel.textContent = s.label;
  progressBar.style.width = ((cur + 1) / slides.length * 100) + '%';

  document.querySelectorAll('.dot').forEach((d, i) => {
    d.classList.toggle('active', i === cur);
  });

  prevBtn.disabled = cur === 0;
  nextBtn.disabled = cur === slides.length - 1;

  notesBody.textContent = s.notes;
  notesSlideNum.textContent = 'Slide ' + (cur + 1) + ' — ' + s.label;

  slideEl.scrollTop = 0;
}

function goTo(i) {
  if (i < 0 || i >= slides.length) return;
  cur = i;
  render();
}

prevBtn.addEventListener('click', () => goTo(cur - 1));
nextBtn.addEventListener('click', () => goTo(cur + 1));
notesBtn.addEventListener('click', () => notesPanel.classList.toggle('open'));
closeNotes.addEventListener('click', () => notesPanel.classList.remove('open'));

document.addEventListener('keydown', (e) => {
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') {
    e.preventDefault(); goTo(cur + 1);
  } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
    e.preventDefault(); goTo(cur - 1);
  } else if (e.key === 'n' || e.key === 'N') {
    notesPanel.classList.toggle('open');
  } else if (e.key === 'Home') { goTo(0); }
  else if (e.key === 'End') { goTo(slides.length - 1); }
});

render();
</script>
